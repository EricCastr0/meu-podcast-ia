name: Publicador Automatico de Podcast IA

on:
  schedule:
    # Executa todos os dias às 11:00 UTC (08:00 Horário de Brasília)
    - cron: '0 11 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo painel do GitHub

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar FFmpeg (Necessário para juntar os áudios)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar Dependências Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Pipeline de Podcast
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py